# Route A Stage 2: 在 Stage 1（projection_only 对齐）之后，解冻 LLM 首末层精调
#
# 两阶段的理由：
#   Stage 1  projection 是随机初始化的，视觉特征对 LLM 来说是噪声。先只训
#            projection，把视觉空间对齐到 LLM 的 embedding 空间。
#   Stage 2  对齐之后再解冻 LLM 的 embedding / 首层 / 末层 / ln_f / lm_head，
#            让语言侧适应票据这个新领域。此时 lr 要调小，避免破坏已对齐的表示。
#
# 用法：
#   python src/train.py --config configs/route_a_stage2.yaml \
#       --init-from checkpoints/route_a_stage1/best_model.pt
stage:
  name: "route_a_stage2"
  description: "Stage1 对齐后解冻 LLM 首末层精调"

model:
  vision_model_name: "google/siglip2-base-patch16-naflex"
  tokenizer_name: "Qwen/Qwen2-1.5B"
  llm_type: "hf_lora"
  hf_model_name: "Qwen/Qwen2-1.5B"
  hf_lora_r: 16
  hf_lora_alpha: 32
  hf_lora_dropout: 0.05
  llm_hidden_size: 1536
  projection_intermediate_dim: 3072
  # 视觉 embedding 尺度是文本的 10 倍、且 576 个 patch 淹没 60~90 个文本 token，
  # 导致 LLM 忽略视觉、输出全 null（loss 0.37 但 F1 = 0）。详见 projection.py。
  projection_out_norm: true
  projection_target_row_norm: 0.65   # 实测 Qwen2-1.5B 文本 embedding 行范数中位
  projection_pool: 2             # 576 -> 144 patch，图像 token 占比 86% -> 62%

data:
  language: "chinese"
  train_path: "data/synthetic/train/train.jsonl"
  val_path: "data/synthetic/val/val.jsonl"
  max_val_samples: 400

training:
  epochs: 6
  # batch 4 时单进程就要 22.97G，在 24G 卡上 OOM（每图 1024 个 patch token，
  # batch 4 即 4096 图像 token 穿过 1.5B LLM）。改 2×8，等效 batch 不变。
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2e-5        # 比 Stage1 的 5e-5 小，保护已对齐的表示
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  optimizer: "adamw"
  scheduler: "cosine"
  mixed_precision: "bf16"

freezing:
  freeze_vision: true
  train_projection: true
  freeze_strategy: "projection_llm_ends"   # 额外解冻 embedding + 首末层 + ln_f + lm_head

checkpointing:
  save_every_n_epochs: 2
  save_best_by: "val_loss"
  output_dir: "checkpoints/route_a_stage2"

sequence:
  max_sequence_length: 2048
  max_num_patches: 1024
